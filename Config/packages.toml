# 插件源码；all 表示全部机型

# 界面主题
[luci-theme-shadcn]
repository = "https://github.com/eamonxg/luci-theme-shadcn.git"
branch = "main"
profiles = ["all"]
mode = "whole"

# 扩展软件包
[viking]
repository = "https://github.com/VIKINGYFY/packages.git"
branch = "main"
profiles = ["all"]
mode = "whole"

# 代理界面
[passwall]
repository = "https://github.com/Openwrt-Passwall/openwrt-passwall.git"
branch = "main"
profiles = ["s20p-mt76", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "nested"
directories = ["luci-app-passwall"]

# 透明代理
[daed]
repository = "https://github.com/kenzok8/small.git"
branch = "master"
profiles = ["s20p-mt76", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "nested"
directories = ["dae", "daed", "luci-app-daede", "v2ray-geodata"]

# 异地组网
[easytier]
repository = "https://github.com/EasyTier/luci-app-easytier.git"
branch = "main"
profiles = ["s20p-mt76", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "whole"

# 无线组网
[mesh]
repository = "https://github.com/xxosdev/luci-app-mesh.git"
branch = "main"
profiles = ["xiaomi-be6500", "tenda-be12-pro", "s20p-mt76", "7dr7299-mt76"]
mode = "mesh"

# 代理核心
[honk]
repository = "https://github.com/189160/luci-app-honk.git"
commit = "5643dc570baf158b65d0bf7342afd6e15ab305fc"
profiles = ["s20p-mt76", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "honk"
