# 插件源码；每次构建解析分支最新提交，all 表示全部机型

# 界面主题
[luci-theme-shadcn]
repository = "https://github.com/eamonxg/luci-theme-shadcn.git"
branch = "main"
profiles = ["all"]
mode = "whole"

[vantage]
repository = "https://github.com/anothaDev/luci-theme-vantage.git"
branch = "main"
profiles = ["all"]
mode = "nested"
directories = ["luci-theme-vantage", "luci-app-vantage"]

# 扩展软件包
[viking]
repository = "https://github.com/VIKINGYFY/packages.git"
branch = "main"
profiles = ["all"]
mode = "whole"

# 旧版 LuCI 的广告过滤界面
[luci-app-adguardhome]
repository = "https://github.com/w9315273/luci-app-adguardhome.git"
branch = "main"
profiles = ["7dr7299-mtk"]
mode = "whole"

# 代理界面
[passwall]
repository = "https://github.com/Openwrt-Passwall/openwrt-passwall.git"
branch = "main"
profiles = ["s20p-mt76", "jdcloud-re-cs-06", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "nested"
directories = ["luci-app-passwall"]

# 透明代理
[daed]
repository = "https://github.com/kenzok8/small.git"
branch = "master"
profiles = ["s20p-mt76", "jdcloud-re-cs-06", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "nested"
directories = ["dae", "daed", "luci-app-daede", "v2ray-geodata"]

# 旧版源码的独立代理编译器；固定兼容快照，不随插件分支更新
[golang-daed]
repository = "https://github.com/immortalwrt/packages.git"
commit = "25ad600a90980bed1ee76a212f9a5e42b499bb62"
profiles = ["7dr7299-mtk", "s20p-mtk"]
mode = "golang-toolchain"
version = "1.27"

# 异地组网
[easytier]
repository = "https://github.com/EasyTier/luci-app-easytier.git"
branch = "main"
profiles = ["s20p-mt76", "jdcloud-re-cs-06", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "whole"

# 混合 Mesh 组网
[fakemesh]
repository = "https://github.com/x-wrt/com.x-wrt.git"
branch = "master"
profiles = ["tenda-be12-pro", "jdcloud-re-cs-06"]
mode = "fakemesh"

# 代理核心
[honk]
repository = "https://github.com/189160/luci-app-honk.git"
branch = "main"
profiles = ["s20p-mt76", "jdcloud-re-cs-06", "s20p-mtk", "x86-64", "7dr7299-mt76", "7dr7299-mtk"]
mode = "honk"
