# 构建与清理

# 定时构建
scheduled_builds = true

# 并行机型数
max_parallel = 10

# 附件保留天数
artifact_retention_days = 14

# 每机型保留版本数
releases_keep_per_profile = 1

# 旧版本保护天数，0 表示立即清理
release_recovery_days = 0

# 缓存保留代数
cache_keep_generations = 1

# 缓存保护天数，0 表示成功替换后立即清理旧代
cache_min_age_days = 0

# 每个 workflow 保留的运行记录数
workflow_runs_keep_per_workflow = 3

# 运行记录保护天数，0 表示超过保留数后立即清理
workflow_runs_min_age_days = 0
