# 源码与机型

[sources.viking]
repository = "https://github.com/VIKINGYFY/immortalwrt.git"
branch = "owrt"
# 非 x86 的开源无线机型启用 BBR / fq
network_tuning = true

[sources.chasey]
repository = "https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git"
branch = "25.12"
# 厂商无线默认值和 daed / honk 服务处理
vendor_wireless = true

[sources.padavan-7dr7299]
repository = "https://github.com/padavanonly/immortalwrt-mt798x-6.6.git"
branch = "mt798x-mt799x-6.6-mtwifi"
# 7DR7299 MTK 使用 shell 版厂商无线默认值
vendor_wireless = true
wireless_defaults = "mtwifi-shell"

# 7DR7299 开源版
[profiles.7dr7299-mt76]
display_name = "TP-Link TL-7DR7299 v1 · MT76"
hostname = "7DR7299-MT76"
source = "viking"
config = "Config/TPLINK-7DR7299-MT76.txt"

[profiles.7dr7299-mt76.kernel_config]
path = "target/linux/mediatek/filogic/config-6.18"

[profiles.7dr7299-mt76.kernel_config.options]
BPF_SYSCALL = "y"
BPF_JIT = "y"
NET_SCH_BPF = "y"

# 7DR7299 闭源版
[profiles.7dr7299-mtk]
display_name = "TP-Link TL-7DR7299 v1 · MTK"
hostname = "7DR7299-MTK"
source = "padavan-7dr7299"
config = "Config/TPLINK-7DR7299-MTK.txt"
patches = ["Scripts/Patches/mt-wifi7-ac-num.patch"]

[profiles.7dr7299-mtk.kernel_config]
path = "target/linux/mediatek/filogic_a73/config-6.6"

[profiles.7dr7299-mtk.kernel_config.options]
BPF_SYSCALL = "y"
BPF_JIT = "y"
NET_SCH_BPF = "y"

