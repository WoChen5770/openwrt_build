# 源码与机型

[sources.viking]
repository = "https://github.com/VIKINGYFY/immortalwrt.git"
branch = "owrt"

[sources.chasey]
repository = "https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git"
branch = "25.12"

[sources.padavan-7dr7299]
repository = "https://github.com/padavanonly/immortalwrt-mt798x-6.6.git"
branch = "mt798x-mt799x-6.6-mtwifi"

# 7DR7299 开源版
[profiles.7dr7299-mt76]
display_name = "TP-Link TL-7DR7299 v1 · MT76"
source = "viking"
target = "mediatek"
subtarget = "filogic"
device = "tplink_tl-7dr7299-v1"
image_match = "tplink_tl-7dr7299-v1"
variant = "mt76"
legacy_name = "TPLINK-7DR7299-MT76"
hostname = "7DR7299-MT76"
network_tuning = true
ccache_group = "viking-filogic"
ccache_priority = 30

# 完整机型配置
config = "Config/TPLINK-7DR7299-MT76.txt"

# 必选配置
required = [
  "PACKAGE_kmod-tcp-bbr",
  "PACKAGE_kmod-sched",
  "PACKAGE_kmod-mt7992-firmware",
  "PACKAGE_mt7988-wo-firmware",
  "PACKAGE_kmod-dsa-rtl837x",
  "PACKAGE_kmod-sfp",
  "PACKAGE_kmod-usb3",
  "PACKAGE_automount",
]

# 固件必需包
required_image_packages = [
  "kmod-tcp-bbr",
  "kmod-sched",
  "kmod-mt7992-firmware",
  "mt7988-wo-firmware",
  "kmod-dsa-rtl837x",
  "kmod-sfp",
  "kmod-usb3",
  "automount",
]

# 固件禁用包
forbidden_image_packages = ["kmod-mt_wifi", "kmod-mt_wifi7", "mtwifi-cfg"]

# 禁用配置
forbidden = ["PACKAGE_kmod-mt_wifi", "PACKAGE_kmod-mt_wifi7", "PACKAGE_mtwifi-cfg", "PACKAGE_mtwifi-cfg-ucode"]

# 内核补充项
[profiles.7dr7299-mt76.kernel_config]
path = "target/linux/mediatek/filogic/config-6.18"

[profiles.7dr7299-mt76.kernel_config.options]
BPF_SYSCALL = "y"
BPF_JIT = "y"
NET_SCH_BPF = "y"

# 驱动与镜像校验
[profiles.7dr7299-mt76.expected_config]
TARGET_ROOTFS_INITRAMFS = "y"

