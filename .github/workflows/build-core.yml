name: Firmware build core

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      fingerprint:
        required: true
        type: string
      plan_artifact_id:
        required: true
        type: string
      retention_days:
        required: true
        type: number
      publish:
        required: true
        type: boolean

concurrency:
  group: firmware-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.firmware-artifact.outputs.artifact-id }}
      source_run_attempt: ${{ steps.identity.outputs.attempt }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_DIR: ${{ github.workspace }}/openwrt
      CCACHE_MAXSIZE: 1G
      # PROFILE is an upstream Make variable; do not export our CI id under it.
      FIRMWARE_PROFILE: ${{ inputs.profile }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      FINGERPRINT: ${{ inputs.fingerprint }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set ccache location
        # Both upstream rules.mk files use TOPDIR/.ccache by default.
        run: echo "CCACHE_DIR=$SOURCE_DIR/.ccache" >> "$GITHUB_ENV"
      - name: Record compilation attempt
        id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.plan_artifact_id }}
          merge-multiple: true
          path: .state/
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Install build dependencies
        run: bash scripts/install-dependencies.sh
      - name: Checkout locked source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.build import checkout, read_json
          lock = read_json(Path('.state') / (os.environ['FIRMWARE_PROFILE'] + '.json'))
          assert lock['source']['commit'] == os.environ['SOURCE_COMMIT']
          assert lock['fingerprint'] == os.environ['FINGERPRINT']
          checkout(lock['source']['repository'], lock['source']['commit'], Path(os.environ['SOURCE_DIR']))
          PY
          df -h .
      - name: Restore compiler and download caches
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.SOURCE_DIR }}/dl
          key: firmware-${{ runner.os }}-${{ inputs.profile }}-${{ inputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            firmware-${{ runner.os }}-${{ inputs.profile }}-${{ inputs.fingerprint }}-
            firmware-${{ runner.os }}-${{ inputs.profile }}-
      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats
      - name: Integrate plugins and verify defconfig
        run: |
          set -euo pipefail
          mkdir -p logs
          python3 scripts/build.py prepare --source "$SOURCE_DIR" --lock ".state/$FIRMWARE_PROFILE.json" 2>&1 | tee logs/prepare.log
      - name: Compile with serial diagnostic retry
        id: compile
        run: bash scripts/compile.sh "$SOURCE_DIR" "$GITHUB_WORKSPACE/logs"
      - name: Save successful compilation caches
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.SOURCE_DIR }}/dl
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Collect firmware, packages and provenance
        id: collect
        run: |
          set -euo pipefail
          python3 scripts/build.py collect --source "$SOURCE_DIR" --lock ".state/$FIRMWARE_PROFILE.json" --output-dir out 2>&1 | tee logs/collect.log
      - name: Preserve images for failed collection diagnostics
        if: failure() && steps.compile.outcome == 'success' && steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic-images-${{ inputs.profile }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_DIR }}/bin/targets/**/*.bin
            ${{ env.SOURCE_DIR }}/bin/targets/**/*.manifest
            ${{ env.SOURCE_DIR }}/bin/targets/**/*.json
            ${{ env.SOURCE_DIR }}/bin/targets/**/*.buildinfo
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: firmware-artifact
        with:
          name: firmware-${{ inputs.profile }}-${{ github.run_attempt }}
          path: out/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
      - name: Save configuration diagnostics
        if: always()
        run: |
          mkdir -p logs
          if [[ -f "$SOURCE_DIR/.config" ]]; then cp "$SOURCE_DIR/.config" logs/config.full; fi
          if [[ -d "$SOURCE_DIR/logs" ]]; then cp -R "$SOURCE_DIR/logs" logs/upstream; fi
          if [[ -d "$SOURCE_DIR/.ccache" ]]; then
            CCACHE_DIR="$SOURCE_DIR/.ccache" ccache --show-stats 2>&1 | tee logs/ccache.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-${{ inputs.profile }}-${{ github.run_attempt }}
          path: |
            logs/
            .state/${{ inputs.profile }}.json
          include-hidden-files: true
          retention-days: ${{ inputs.retention_days }}
  publish:
    needs: compile
    if: inputs.publish
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-core.yml
    with:
      profile: ${{ inputs.profile }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ needs.compile.outputs.source_run_attempt }}
      artifact_id: ${{ needs.compile.outputs.artifact_id }}
