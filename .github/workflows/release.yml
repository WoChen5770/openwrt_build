name: Recover firmware releases

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 已完成编译的 Build firmware 任务 ID（只补发，不重编）
        required: true
        type: string
      profile:
        description: 补发机型（all 仅处理已有成功产物）
        type: choice
        default: all
        options: [all, xiaomi-be6500, tenda-be12-pro, s20p-mt76, s20p-mtk, x86-64]
  workflow_run:
    workflows: [Build firmware]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_releases: ${{ steps.plan.outputs.has_releases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select trusted successful build artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          PROFILE: ${{ inputs.profile || 'all' }}
          AUTO_RECOVER: ${{ github.event_name == 'workflow_run' }}
        run: python3 Scripts/release.py plan
  publish:
    name: ${{ matrix.profile }}
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/publish-core.yml
    with:
      profile: ${{ matrix.profile }}
      source_run_id: ${{ matrix.source_run_id }}
      source_run_attempt: ${{ matrix.source_run_attempt }}
      artifact_id: ${{ matrix.artifact_id }}
